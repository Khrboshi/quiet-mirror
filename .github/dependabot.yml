# Dependabot configuration for quiet-mirror
#
# Place at: .github/dependabot.yml   (in the quiet-mirror repository)
#
# WHAT THIS DOES, AND WHAT IT DOES NOT
#
#   Dependabot has two separate jobs. Security updates — the ones that fire when
#   a vulnerability is published — are switched on in repository settings and do
#   not need this file. Those are already working on this repo: the fflate bump
#   on 3 Sep 2026 was one of them.
#
#   This file turns on the OTHER job: scheduled version updates, which keep
#   dependencies moving before a CVE forces the issue. It also adds coverage for
#   your GitHub Actions, which nothing currently watches.
#
# WHY THE GROUPING
#
#   quiet-mirror has 21 runtime and 6 development dependencies across 7
#   workflows. Ungrouped, a weekly run can open a dozen pull requests. Grouping
#   collapses each category into one PR, so a normal week is two or three PRs
#   rather than fifteen.
#
#   Each group is restricted to minor and patch updates. Major versions are not
#   suppressed — they simply arrive in their own pull request instead of being
#   folded in with routine ones, so they cannot be merged without being noticed.
#
# TO TURN IT OFF
#   Delete this file. Security updates continue regardless.

version: 2

updates:
  # ── npm ────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Next, React and friends move together. Splitting them produces PRs that
      # cannot pass CI on their own.
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      supabase:
        patterns:
          - "@supabase/*"
        update-types:
          - "minor"
          - "patch"
      # Everything else, minor and patch only.
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
          - "@supabase/*"
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ─────────────────────────────────────────────────────
  # Nothing currently watches the actions in your 7 workflows. This is also what
  # will keep actions/checkout and actions/setup-node current, which is the
  # subject of the Node 20 deprecation warning appearing on the Auditor runs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
